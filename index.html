<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <div id="title-bar">
      <span id="game-title">SANDBOX QUEST</span>
      <span id="subtitle">A tour of sandbox-answers</span>
    </div>
    <div id="game-container">
      <canvas id="canvas" width="1024" height="704"></canvas>
    </div>
    <p id="hint">WASD / Arrow Keys to walk &nbsp;&bull;&nbsp; SPACE to talk</p>

    <!-- Mobile controls: in-flow below canvas, touch devices only -->
    <div id="mobile-controls">
      <div id="dpad">
        <div></div>
        <button id="btn-up" class="dpad-btn">&#9650;</button>
        <div></div>
        <button id="btn-left" class="dpad-btn">&#9664;</button>
        <div class="dpad-center"></div>
        <button id="btn-right" class="dpad-btn">&#9654;</button>
        <div></div>
        <button id="btn-down" class="dpad-btn">&#9660;</button>
        <div></div>
      </div>
      <button id="btn-space">TALK</button>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div id="card">
      <button id="close-btn" onclick="closeOverlay()" aria-label="Close">&#x2715;</button>
      <div id="card-content"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
